<button class="btn btn-sm status-toggle" data-id="{$id}" data-status="{$status}" onclick="toggleStatus(this)" style="background:{$status==1?'#f6ffed':'#fff2f0'};color:{$status==1?'#52c41a':'#ff4d4f'};border:1px solid {$status==1?'#b7eb8f':'#ffccc7'};border-radius:4px;padding:2px 8px;cursor:pointer;font-size:12px;">{$status==1?'启用':'禁用'}</button>
