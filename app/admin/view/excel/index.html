{extend name="layout/base" /}

{block name="content"}
<div class="toolbar">
    <div>
        <input type="text" id="searchInput" placeholder="搜索项目..." value="{$search}" onkeydown="if(event.key==='Enter')doSearch()" style="padding:8px 12px;border:1px solid #d9d9d9;border-radius:4px;outline:none;width:200px;">
        <button class="btn btn-primary" onclick="doSearch()" style="margin-left:8px;">搜索</button>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>项目名称</th>
            <th>MD5</th>
            <th>创建时间</th>
            <th>更新时间</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {foreach $list as $item}
        <tr>
            <td>{$item.id}</td>
            <td>{$item.project}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="{$item.md5}">{$item.md5_short}</td>
            <td>{$item.date}</td>
            <td>{$item.change_date}</td>
            <td>
                <button class="btn btn-sm btn-del" onclick="doDelete({$item.id})">删除</button>
            </td>
        </tr>
        {/foreach}
    </tbody>
</table>
{$pagination|raw}
{/block}

{block name="script"}
<script>
function doSearch() {
    var q = document.getElementById('searchInput').value;
    window.location.href = '/admin/excel?search=' + encodeURIComponent(q);
}

function doDelete(id) {
    if (!confirm('确定要删除该缓存记录吗？')) return;
    var xhr = new XMLHttpRequest();
    xhr.open('DELETE', '/admin/excel', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.setRequestHeader('admin-token', localStorage.getItem('admin_token'));
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4) {
            var res = JSON.parse(xhr.responseText);
            if (res.code == 0) {
                window.location.reload();
            } else {
                alert(res.echo || '删除失败');
            }
        }
    };
    xhr.send('id=' + id);
}
</script>
{/block}
