<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{$title} - AOSS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.register-box { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 40px; width: 380px; }
.register-box h2 { text-align: center; color: #333; margin-bottom: 8px; font-size: 24px; }
.register-box .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 28px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; outline: none; transition: border-color 0.3s; }
.form-group input:focus { border-color: #4096ff; }
.form-group .tip { margin-top: 4px; color: #bbb; font-size: 12px; }
.captcha-row { display: flex; gap: 10px; }
.captcha-row input { flex: 1; }
.captcha-row img { height: 42px; border-radius: 4px; cursor: pointer; border: 1px solid #d9d9d9; }
.btn { width: 100%; padding: 10px; background: #1677ff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
.btn:hover { background: #4096ff; }
.error { color: #ff4d4f; font-size: 13px; margin-top: 10px; display: none; }
.links { margin-top: 18px; text-align: center; font-size: 13px; color: #999; }
.links a { color: #1677ff; }
.links a:hover { text-decoration: underline; }
.links .back { color: #999; margin-left: 12px; }
.links .back:hover { color: #666; text-decoration: none; }
</style>
</head>
<body>
<div class="register-box">
    <h2>注册 AOSS 账号</h2>
    <div class="subtitle">注册即可使用平台提供的相关能力</div>
    <form id="registerForm" onsubmit="return false;">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名（至少2个字符）" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码（至少6位）" required>
        </div>
        <div class="form-group">
            <label>昵称（选填）</label>
            <input type="text" id="nickname" name="nickname" placeholder="不填则默认为用户名">
        </div>
        <div class="form-group">
            <label>验证码</label>
            <div class="captcha-row">
                <input type="text" id="code" name="code" placeholder="请输入验证码" maxlength="4" required>
                <img id="captchaImg" src="/captcha/gif" alt="验证码" title="点击刷新验证码">
            </div>
        </div>
        <button class="btn" id="submitBtn">注 册</button>
        <div id="errorMsg" class="error"></div>
    </form>
    <div class="links">
        已有账号？<a href="/login">直接登录</a>
        <a class="back" href="/">返回首页</a>
    </div>
</div>
{literal}
<script>
document.getElementById('captchaImg').onclick = function() { this.src = '/captcha/gif?_=' + Date.now(); };

document.getElementById('submitBtn').onclick = function() {
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;
    var nickname = document.getElementById('nickname').value;
    var code = document.getElementById('code').value;
    if (!username || !password || !code) { alert('请填写完整信息'); return; }
    if (username.length < 2) { alert('用户名至少2个字符'); return; }
    if (password.length < 6) { alert('密码至少6位'); return; }
    var errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    var btn = this;
    btn.disabled = true;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/register', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4) {
            btn.disabled = false;
            var res = JSON.parse(xhr.responseText);
            if (res.code == 0) {
                window.location.href = '/';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.textContent = res.echo;
                document.getElementById('captchaImg').src = '/captcha/gif?_=' + Date.now();
            }
        }
    };
    xhr.send('username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password) + '&nickname=' + encodeURIComponent(nickname) + '&code=' + encodeURIComponent(code));
};
</script>
{/literal}
</body>
</html>
