<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{$title} - AOSS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 40px; width: 380px; }
.login-box h2 { text-align: center; color: #333; margin-bottom: 8px; font-size: 24px; }
.login-box .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 28px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; outline: none; transition: border-color 0.3s; }
.form-group input:focus { border-color: #4096ff; }
.form-group .tip { margin-top: 4px; color: #bbb; font-size: 12px; line-height: 1.6; }
.captcha-row { display: flex; gap: 10px; }
.captcha-row input { flex: 1; }
.captcha-row img { height: 42px; border-radius: 4px; cursor: pointer; border: 1px solid #d9d9d9; }
.btn { width: 100%; padding: 10px; background: #1677ff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
.btn:hover { background: #4096ff; }
.error { color: #ff4d4f; font-size: 13px; margin-top: 10px; display: none; }
.links { margin-top: 18px; text-align: center; font-size: 13px; color: #999; }
.links a { color: #1677ff; }
.links a:hover { text-decoration: underline; }
.links .back { color: #999; margin-left: 12px; }
.links .back:hover { color: #666; text-decoration: none; }
</style>
</head>
<body>
<div class="login-box">
    <h2>AOSS 用户登录</h2>
    <div class="subtitle">登录后可使用平台提供的相关能力</div>
    <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="form-group" id="captchaGroup" style="display: {if $need_captcha}block{else /}none{/if};">
            <label>验证码</label>
            <div class="captcha-row">
                <input type="text" id="code" name="code" placeholder="请输入验证码" maxlength="4">
                <img id="captchaImg" src="/captcha/gif" alt="验证码" title="点击刷新验证码">
            </div>
            <div class="tip">该 IP 近期存在登录失败记录，需输入验证码；登录成功后自动免验证码</div>
        </div>
        <button class="btn" id="submitBtn">登 录</button>
        <div id="errorMsg" class="error"></div>
    </form>
    <div class="links">
        还没有账号？<a href="/register">立即注册</a>
        <a class="back" href="/">返回首页</a>
    </div>
</div>
{literal}
<script>
var captchaGroup = document.getElementById('captchaGroup');
var captchaInput = document.getElementById('code');
var captchaImg = document.getElementById('captchaImg');

captchaImg.onclick = function() { this.src = '/captcha/gif?_=' + Date.now(); };

// 显示/隐藏验证码，显示时刷新图片并清空输入
function toggleCaptcha(show) {
    captchaGroup.style.display = show ? 'block' : 'none';
    if (show) {
        captchaInput.value = '';
        captchaImg.src = '/captcha/gif?_=' + Date.now();
    }
}

document.getElementById('submitBtn').onclick = function() {
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;
    var code = captchaInput.value;
    var needCaptcha = captchaGroup.style.display !== 'none';
    if (!username || !password) { alert('请填写完整信息'); return; }
    if (needCaptcha && !code) { alert('请输入验证码'); return; }
    var errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    var btn = this;
    btn.disabled = true;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/login', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4) {
            btn.disabled = false;
            var res = JSON.parse(xhr.responseText);
            if (res.code == 0) {
                window.location.href = '/';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.textContent = res.echo;
                // 后端判定需验证码时（登录失败或已存在失败记录），展示验证码
                toggleCaptcha(!!(res.data && res.data.need_captcha));
            }
        }
    };
    xhr.send('username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password) + '&code=' + encodeURIComponent(needCaptcha ? code : ''));
};
</script>
{/literal}
</body>
</html>
